default_provider = "deepseek"
default_model = "deepseek_v4_flash"
default_workflow = "balanced"

[providers.deepseek]
type = "openai_compatible"
base_url = "${DEEPSEEK_BASE_URL}"
api_key_env = "DEEPSEEK_API_KEY"
timeout_seconds = 120
max_retries = 2
include_reasoning = true

[models.deepseek_v4_flash]
id = "deepseek_v4_flash"
provider = "deepseek"
model = "deepseek-v4-flash"
supports_streaming = true
supports_native_tools = true
supports_reasoning = true
supports_system_message = true
supports_image_input = false
context_window = 1000000
max_output_tokens = 8192

[providers.local]
type = "openai_compatible"
base_url = "http://127.0.0.1:11434/v1"
api_key_env = ""

# Pricing and context limits are user configuration, never permanent program facts.

# 可选的本地统计额度，只影响桌面/CLI 进度展示，不是 Provider 余额，也不是单次运行硬限制。
[usage]
daily_token_budget = 100000
monthly_token_budget = 2000000
daily_cost_budget = 2.5
monthly_cost_budget = 50.0

[workflows.review_only]
version = 1
id = "review_only"
label = "只读审查"
description = "只暴露 Git 和读取工具。"
mode = "review"
permissions = "deny_writes"
allowed_tools = ["read_file", "search_text", "find_files", "git_*"]
denied_tools = []

[[workflows.review_only.hooks]]
id = "observe-git"
event = "post_tool_use"
tools = ["git_*"]
action = "observe"
message = "Git 审查工具已完成。"

# 仅 enabled=true 才会启动 stdio 进程做工具发现；未知工具默认仍按高风险审批。
[mcp_servers.local_example]
command = ["python", "path/to/server.py"]
enabled = false
enabled_tools = ["search"]
disabled_tools = []
env_keys = []
startup_timeout = 10
tool_timeout = 60

# 仅对你信任并已核对语义的具体工具设置本地覆盖；服务端 annotation 不会自动降权。
[mcp_servers.local_example.tool_overrides.search]
read_only = true
risk_level = "medium"
always_approval = true
network = true
